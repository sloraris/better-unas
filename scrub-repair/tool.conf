# Read by the better-unas installer. Plain KEY=VALUE, never executed.
NAME=scrub-repair
VERSION=0.1.0
SUMMARY=Finds damaged files and restores verified backup copies
# Asked before the first install. Leave empty if the tool needs no UI step.
SETUP=
# Shown before installing, so people know what will change.
CHANGES=Adds a timer that reads btrfs checksum errors from the kernel log every 15 minutes. Scrubs are read-only; files are replaced only after a verified copy is staged (and, by default, you confirm).
# Command-line entry point: "better-unas scrub-repair status" runs it.
CLI=scrub_repair.py
CONTRACT=1
SCHEMA=settings.json
CONFIG=config
CONFIG_EXAMPLE=config.example
PLUGIN=plugin.py
